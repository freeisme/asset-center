# 办公资产与 IT 服务管理系统 —— OpenResty / Nginx 反向代理站点
#
# 用途：对外只暴露代理端口（80/443），应用端口改为仅本机访问。
#     应用自身已经在 server.py 的 end_headers 中下发同一套安全响应头，
#     这里在代理层再下发一次，保证 Nginx 自己产生的响应（错误页、静态文件、
#     404/50x）也带上这些头，并且不依赖后端是否可达。
#
# 依赖说明：
#   * server_tokens off 只能去掉版本号，响应头里仍然会保留 “Server: openresty”。
#     彻底隐藏 Server 头需要 headers-more 模块的 more_clear_headers。
#     1Panel 自带的 OpenResty 镜像已编译 headers-more（nginx -V 可见
#     --add-module=../headers-more-nginx-module-*）。
#   * 如果目标环境的 Nginx 没有 headers-more，删掉下面所有 more_* 指令，
#     并改用文件末尾注释里的 add_header 写法（该写法无法隐藏 Server 头）。
#
# 部署位置（1Panel OpenResty）：/opt/1panel/www/conf.d/office-asset-mgmt.conf
# 校验与生效：
#   docker exec <openresty 容器名> nginx -t
#   docker exec <openresty 容器名> nginx -s reload

server {
    listen 80;
    listen [::]:80;

    # 改成实际访问使用的域名或服务器 IP；不要用 “_”，否则请求会落到
    # OpenResty 自带的 default_server 静态占位站点上。
    server_name <生产域名或服务器IP>;

    server_tokens off;
    client_max_body_size 10m;

    # 隐藏服务器指纹：整条 Server 头不再返回。
    more_clear_headers Server;

    # 与应用 server.py 保持一致的浏览器安全响应头。
    # more_set_headers 会覆盖后端同名响应头，避免出现重复头。
    more_set_headers "Content-Security-Policy: default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "X-Frame-Options: DENY";
    more_set_headers "X-XSS-Protection: 1; mode=block";
    more_set_headers "Referrer-Policy: same-origin";
    more_set_headers "Permissions-Policy: camera=(), geolocation=(), microphone=(), payment=(), usb=()";
    more_set_headers "Cross-Origin-Opener-Policy: same-origin";
    more_set_headers "Cross-Origin-Resource-Policy: same-origin";

    # 启用 HTTPS 后再打开（证书路径按实际环境替换）：
    # more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 没有 headers-more 模块时的替代写法（放在 server 块内）：
#
#   add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header X-Frame-Options "DENY" always;
#   add_header X-XSS-Protection "1; mode=block" always;
#   add_header Referrer-Policy "same-origin" always;
#   add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
#   add_header Cross-Origin-Opener-Policy "same-origin" always;
#   add_header Cross-Origin-Resource-Policy "same-origin" always;
#
# 注意：add_header 只在自身所在的层级生效，location 里再写 add_header 会
# 覆盖 server 层级的全部 add_header，需要时请把同一组头重复写在 location 内。
